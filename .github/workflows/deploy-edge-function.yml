name: Deploy edge function

# Deployt de hive-tick edge function automatisch zodra de bron wijzigt op main.
# Vereist één repo-secret: SUPABASE_ACCESS_TOKEN
#   (Supabase dashboard → Account → Access Tokens → genereer een token,
#    daarna in GitHub: repo Settings → Secrets and variables → Actions).

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch: {}   # handmatig kunnen triggeren

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: oblzouaapvdippyhxmpo
    steps:
      - uses: actions/checkout@v5

      - name: Controleer of het secret aanwezig is
        id: guard
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN ontbreekt — deploy overgeslagen. Voeg het secret toe in de repo-instellingen."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # Een vaste versie in plaats van "latest": setup-cli hoeft dan geen
      # ongeauthenticeerde GitHub-API-call te doen om de laatste release op te
      # zoeken. Die call liep tegen de rate limit aan ("Failed to resolve latest
      # Supabase CLI release"), ook bij een tweede poging — een wachttijd helpt
      # niet tegen een uitgeput uur-quotum van de runner.
      # Versie bijwerken: https://github.com/supabase/cli/releases
      - name: Supabase CLI installeren
        id: cli1
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Even wachten na een hapering
        if: steps.guard.outputs.skip != 'true' && steps.cli1.outcome == 'failure'
        run: sleep 30

      - name: Supabase CLI installeren (tweede poging)
        if: steps.guard.outputs.skip != 'true' && steps.cli1.outcome == 'failure'
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: hive-tick deployen
        if: steps.guard.outputs.skip != 'true'
        run: supabase functions deploy hive-tick --project-ref "$PROJECT_REF" --no-verify-jwt
