<!DOCTYPE html>
<html lang="en">
<head>
<script src="assets/i18n.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Botty-verse — The World</title>
<meta name="theme-color" content="#1c130b" />
<meta name="description" content="The World: a Creatures-inspired window on the hive — scroll through the classroom, raise the Bottys with your Hand, and open the kits." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥚</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet" />
<style>
  /* ── De Wereld — Creatures-geïnspireerde interface (eigen vormgeving) ───────
     Indeling naar het Creatures-venster: werkbalk boven, een wereld die groter is
     dan het scherm in het midden, statusbalk onder, kits als zwevende vensters. */
  :root{
    --hout:#2a1c10; --hout2:#3a2816; --rand:#6b4a2b; --koper:#c98a3c; --koper2:#f6c75a;
    --licht:#f3e6cf; --zacht:#b89a6a; --groen:#39ff85; --rood:#e0556b; --blauw:#5ec6ff;
    --tb-h:52px; --sb-h:30px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;background:#0d0904;color:var(--licht);font-family:'Nunito',sans-serif;}
  #app{position:fixed;inset:0;display:grid;grid-template-rows:var(--tb-h) 1fr var(--sb-h);}

  /* Werkbalk */
  .werkbalk{display:flex;align-items:center;gap:.35rem;padding:0 64px 0 .5rem;overflow-x:auto;overflow-y:hidden;
    background:linear-gradient(180deg,#3a2816,#241810);border-bottom:2px solid var(--rand);
    box-shadow:inset 0 1px 0 rgba(255,230,168,.15);scrollbar-width:none;}
  .werkbalk::-webkit-scrollbar{display:none;}
  .merk{font-weight:900;color:var(--koper2);white-space:nowrap;font-size:.95rem;margin-right:.3rem;text-decoration:none;}
  .sep{width:1px;align-self:stretch;margin:.55rem .2rem;background:#5a3e22;flex:0 0 auto;}
  .knop{flex:0 0 auto;display:inline-flex;align-items:center;gap:.3rem;height:36px;padding:0 .6rem;border-radius:9px;cursor:pointer;
    font:700 .82rem 'Nunito',sans-serif;color:#e8d6b4;background:linear-gradient(180deg,#4a3420,#2e1f12);
    border:1px solid #6b4a2b;box-shadow:inset 0 1px 0 rgba(255,230,168,.18);white-space:nowrap;}
  .knop:hover{color:#fff1d0;border-color:var(--koper);}
  .knop.actief{background:linear-gradient(180deg,#7a5228,#4a3018);color:#fff3d6;border-color:var(--koper2);box-shadow:0 0 10px rgba(246,199,90,.35),inset 0 1px 0 rgba(255,230,168,.3);}
  .knop .ico{font-size:1.05rem;}
  .knop.klein{padding:0 .5rem;}
  select.knop{appearance:none;padding-right:1.4rem;background-image:linear-gradient(45deg,transparent 50%,#e8d6b4 50%),linear-gradient(135deg,#e8d6b4 50%,transparent 50%),linear-gradient(180deg,#4a3420,#2e1f12);
    background-position:calc(100% - 12px) 16px,calc(100% - 7px) 16px,0 0;background-size:5px 5px,5px 5px,100% 100%;background-repeat:no-repeat;}
  @media (max-width:700px){ .knop .lbl{display:none;} .merk .lbl{display:none;} }

  /* Wereld */
  #wereld{position:relative;overflow:hidden;background:#0a0703;touch-action:none;cursor:none;}
  #scene{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #hand{position:absolute;left:0;top:0;pointer-events:none;font-size:34px;line-height:1;transform:translate(-6px,-4px);
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));transition:transform .08s;z-index:5;}
  #hand.aait{animation:handAai .6s ease-in-out;}
  #hand.tikt{animation:handTik .35s ease-in-out;}
  @keyframes handAai{0%,100%{transform:translate(-6px,-4px) rotate(0)}25%{transform:translate(-6px,-4px) rotate(-14deg)}75%{transform:translate(-6px,-4px) rotate(12deg)}}
  @keyframes handTik{0%,100%{transform:translate(-6px,-4px)}50%{transform:translate(-6px,6px) scale(.9)}}
  .floater{font-size:26px;pointer-events:none;animation:floatOp 1.3s ease-out forwards;}
  @keyframes floatOp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-60px)}}
  .botty-naam{font:800 15px 'Nunito',sans-serif;fill:#fff7e4;paint-order:stroke;stroke:#1a1006;stroke-width:4px;stroke-linejoin:round;}
  .botty.sel .ring{opacity:1;}
  .ring{opacity:0;transition:opacity .3s;}
  .bubbel rect{fill:#fffaf0;stroke:#6b4a2b;stroke-width:2;}
  .bubbel text{font:700 15px 'Nunito',sans-serif;fill:#2a1c10;}
  .navknop{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:64px;border-radius:10px;z-index:4;
    background:rgba(42,28,16,.72);border:1px solid #6b4a2b;color:#f6c75a;font-size:1.3rem;cursor:pointer;}
  .navknop:hover{background:rgba(74,52,32,.9);}
  #nav-l{left:8px;} #nav-r{right:8px;}
  #wereld-melding{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:6;max-width:min(560px,92%);
    background:rgba(28,19,11,.92);border:1px solid #6b4a2b;border-radius:12px;padding:.5rem .8rem;font-size:.85rem;
    color:#ffe6a8;display:none;text-align:center;}
  #noem-pop{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:7;display:none;
    background:linear-gradient(180deg,#3a2816,#241810);border:2px solid var(--koper);border-radius:14px;padding:.7rem .8rem;
    box-shadow:0 10px 30px rgba(0,0,0,.6);width:min(420px,92%);}
  #noem-pop p{font-size:.88rem;margin-bottom:.45rem;}
  #noem-pop form{display:flex;gap:.4rem;}
  #noem-pop input{flex:1;min-width:0;font:700 .9rem 'Nunito',sans-serif;background:#14100a;color:#f3e6cf;border:1px solid #6b4a2b;border-radius:8px;padding:.45rem .6rem;}

  /* Statusbalk */
  .statusbalk{display:flex;align-items:center;gap:.6rem;padding:0 .6rem;font-size:.78rem;color:#cbb189;white-space:nowrap;overflow:hidden;
    background:linear-gradient(180deg,#241810,#1a1209);border-top:2px solid var(--rand);}
  .sb-vak{display:inline-flex;align-items:center;gap:.3rem;padding:0 .5rem;height:20px;border:1px solid #4a3420;border-radius:5px;background:#140e07;flex:0 0 auto;}
  #sb-event{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;border:none;background:none;cursor:pointer;color:#e8d6b4;}
  .sb-meter{width:56px;height:7px;border-radius:4px;background:#2a1c10;overflow:hidden;}
  .sb-meter i{display:block;height:100%;background:linear-gradient(90deg,#e0556b,#f6c75a,#39ff85);}
  @media (max-width:600px){ #sb-score,#sb-tijd{display:none;} }
  #eventlog{position:fixed;left:8px;bottom:calc(var(--sb-h) + 6px);z-index:30;width:min(460px,calc(100vw - 16px));max-height:45vh;overflow:auto;display:none;
    background:#1a1209;border:1px solid #6b4a2b;border-radius:10px;padding:.4rem;box-shadow:0 10px 30px rgba(0,0,0,.6);}
  #eventlog li{list-style:none;font-size:.8rem;padding:.2rem .3rem;border-bottom:1px solid #2a1c10;color:#e8d6b4;}
  #eventlog li span{color:#8a7350;margin-right:.4rem;font-variant-numeric:tabular-nums;}

  /* Kits als vensters */
  .kitv{position:fixed;z-index:20;width:330px;max-width:calc(100vw - 16px);max-height:calc(100vh - var(--tb-h) - var(--sb-h) - 16px);
    display:none;flex-direction:column;background:linear-gradient(180deg,#2a1d11,#1c130b);border:2px solid var(--rand);border-radius:14px;
    box-shadow:0 14px 40px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,230,168,.12);}
  .kitv.open{display:flex;}
  .kitv-kop{display:flex;align-items:center;gap:.45rem;padding:.45rem .6rem;cursor:grab;user-select:none;touch-action:none;
    background:linear-gradient(180deg,#4a3420,#2e1f12);border-bottom:1px solid #6b4a2b;border-radius:12px 12px 0 0;}
  .kitv-kop .lampje{width:8px;height:8px;border-radius:50%;background:var(--groen);box-shadow:0 0 6px var(--groen);}
  .kitv-kop b{flex:1;font-weight:900;color:var(--koper2);font-size:.86rem;letter-spacing:.04em;text-transform:uppercase;}
  .kitv-kop button{background:none;border:none;color:#e8d6b4;font-size:1.1rem;cursor:pointer;line-height:1;}
  .kitv-body{padding:.6rem .7rem .7rem;overflow:auto;font-size:.84rem;}
  .kitv-leeg{color:var(--zacht);font-style:italic;}
  .kit-rij{display:flex;align-items:center;gap:.5rem;margin:.18rem 0;}
  .kit-rij .l{flex:0 0 112px;color:#cbb189;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kit-rij .v{flex:0 0 34px;text-align:right;font-variant-numeric:tabular-nums;color:#e8d6b4;}
  .balk{flex:1;height:9px;border-radius:5px;background:#120c06;border:1px solid #3a2816;overflow:hidden;}
  .balk i{display:block;height:100%;border-radius:4px;transition:width .5s ease;}
  .kit-kop2{margin:.6rem 0 .25rem;font-weight:900;color:#a3ffce;font-size:.8rem;letter-spacing:.03em;}
  .portret{display:flex;gap:.7rem;align-items:center;margin-bottom:.4rem;}
  .portret svg{width:82px;height:100px;flex:0 0 auto;background:radial-gradient(circle at 50% 70%,#3a2816,#140e07);border-radius:10px;border:1px solid #4a3420;}
  .portret .n{font-size:1.15rem;font-weight:900;color:#fff3d6;}
  .portret .s{font-size:.78rem;color:#cbb189;line-height:1.35;}
  .gedachte{margin-top:.35rem;font-style:italic;color:#ffe6a8;}
  .opv-nu{background:#140e07;border:1px solid #4a3420;border-radius:10px;padding:.5rem .6rem;margin-bottom:.5rem;}
  .opv-knoppen{display:flex;gap:.4rem;margin-top:.45rem;flex-wrap:wrap;}
  .opv-knoppen .knop{height:32px;}
  .woordjes{display:flex;flex-wrap:wrap;gap:.3rem;}
  .woordje{background:#140e07;border:1px solid #4a3420;border-radius:999px;padding:.12rem .5rem;font-size:.78rem;}
  .lesboek li{list-style:none;font-size:.78rem;padding:.18rem 0;border-bottom:1px dashed #3a2816;}
  .lesboek li b{color:#ffe6a8;}
  .noot{font-size:.74rem;color:#9a8460;line-height:1.4;margin-top:.45rem;}
  #sk-net{width:100%;height:auto;display:block;background:#060f0d;border:1px solid #14403c;border-radius:8px;}
  #sk-grafiek{width:100%;height:90px;display:block;background:#060f0d;border:1px solid #14403c;border-radius:8px;}
  @media (max-width:700px){
    .kitv{left:8px !important;right:8px !important;width:auto;top:auto !important;bottom:calc(var(--sb-h) + 8px);max-height:58vh;}
    .kitv-kop{cursor:default;}
  }
  @media (prefers-reduced-motion:reduce){ #hand.aait,#hand.tikt,.floater{animation:none;} }
</style>
</head>
<body>
<div id="app">
  <!-- Werkbalk: gereedschap voor de Hand, Botty-keuze, kits, camera, geluid -->
  <nav class="werkbalk" aria-label="toolbar">
    <a class="merk" href="./" title="Back to the hive" data-nl-title="Terug naar de hive">🥚 <span class="lbl">Botty-verse</span></a>
    <div class="sep"></div>
    <button class="knop actief" data-tool="kijk" title="Look — select a Botty" data-nl-title="Kijk — kies een Botty"><span class="ico">👁️</span><span class="lbl t en">Look</span><span class="lbl t nl">Kijk</span></button>
    <button class="knop" data-tool="aai" title="Stroke — rewards what it is doing now" data-nl-title="Aaien — beloont wat hij nu doet"><span class="ico">🖐</span><span class="lbl t en">Stroke</span><span class="lbl t nl">Aaien</span></button>
    <button class="knop" data-tool="tik" title="Tap — corrects what it is doing now" data-nl-title="Tikje — corrigeert wat hij nu doet"><span class="ico">👆</span><span class="lbl t en">Tap</span><span class="lbl t nl">Tikje</span></button>
    <button class="knop" data-tool="voer" title="Feed" data-nl-title="Voeren"><span class="ico">🍎</span><span class="lbl t en">Feed</span><span class="lbl t nl">Voeren</span></button>
    <button class="knop" data-tool="medicijn" title="Medicine" data-nl-title="Medicijn"><span class="ico">💊</span><span class="lbl t en">Medicine</span><span class="lbl t nl">Medicijn</span></button>
    <button class="knop" data-tool="noem" title="Name — teach a word for what it is busy with" data-nl-title="Noem — leer een woord voor waar hij mee bezig is"><span class="ico">🏷️</span><span class="lbl t en">Name</span><span class="lbl t nl">Noem</span></button>
    <div class="sep"></div>
    <select class="knop" id="botsel" aria-label="Botty"></select>
    <div class="sep"></div>
    <button class="knop klein" data-kit="eigenaar" title="Owner kit" data-nl-title="Eigenaarskit"><span class="ico">👤</span><span class="lbl t en">Owner</span><span class="lbl t nl">Eigenaar</span></button>
    <button class="knop klein" data-kit="gezondheid" title="Health kit" data-nl-title="Gezondheidskit"><span class="ico">❤️</span><span class="lbl t en">Health</span><span class="lbl t nl">Gezondheid</span></button>
    <button class="knop klein" data-kit="wetenschap" title="Science kit" data-nl-title="Wetenschapskit"><span class="ico">🧠</span><span class="lbl t en">Science</span><span class="lbl t nl">Wetenschap</span></button>
    <button class="knop klein" data-kit="opvoeden" title="Raising kit" data-nl-title="Opvoedkit"><span class="ico">🎓</span><span class="lbl t en">Raise</span><span class="lbl t nl">Opvoeden</span></button>
    <div class="sep"></div>
    <select class="knop" id="plekken" aria-label="Places" title="Favourite places" data-nl-title="Favoriete plekken"></select>
    <button class="knop klein" id="volgknop" title="Follow the selected Botty" data-nl-title="Volg de gekozen Botty"><span class="ico">🎥</span><span class="lbl t en">Follow</span><span class="lbl t nl">Volg</span></button>
    <button class="knop klein" id="zoom-uit" title="Zoom out" data-nl-title="Uitzoomen">−</button>
    <button class="knop klein" id="zoom-in" title="Zoom in" data-nl-title="Inzoomen">+</button>
    <button class="knop klein" id="geluidknop" title="Sound on/off" data-nl-title="Geluid aan/uit" aria-pressed="false"><span class="ico">🔇</span></button>
  </nav>

  <!-- De wereld: groter dan het scherm, de camera schuift -->
  <main id="wereld" aria-label="The World">
    <svg id="scene" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" role="img" aria-label="The classroom with the Bottys">
      <defs>
        <radialGradient id="selGloed" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffe066" stop-opacity=".55"/><stop offset="1" stop-color="#ffe066" stop-opacity="0"/></radialGradient>
      </defs>
      <rect x="-2000" y="-1000" width="5500" height="2844" fill="#0a0703"/>
      <image href="assets/construct-achtergrond.webp" x="0" y="0" width="1500" height="844" preserveAspectRatio="none"/>
      <g id="objlaag"></g>
      <g id="bottylaag"></g>
      <g id="fxlaag"></g>
      <rect id="nachtlaag" x="0" y="0" width="1500" height="844" fill="#0b1533" opacity="0" style="mix-blend-mode:multiply;transition:opacity 4s" pointer-events="none"/>
    </svg>
    <div id="hand">🖐</div>
    <button class="navknop" id="nav-l" aria-label="Scroll left" title="Scroll left" data-nl-title="Naar links">‹</button>
    <button class="navknop" id="nav-r" aria-label="Scroll right" title="Scroll right" data-nl-title="Naar rechts">›</button>
    <div id="wereld-melding" role="status" aria-live="polite"></div>
    <div id="noem-pop">
      <p id="noem-vraag"></p>
      <form id="noem-form" autocomplete="off">
        <input id="noem-input" maxlength="16" required />
        <button class="knop" type="submit">🏷️ OK</button>
        <button class="knop" type="button" id="noem-annuleer">✕</button>
      </form>
    </div>
  </main>

  <!-- Statusbalk: gebeurtenis, levenskracht, score, tijd -->
  <footer class="statusbalk">
    <button class="sb-vak" id="sb-event" title="Show recent events" data-nl-title="Toon recente gebeurtenissen">📜 …</button>
    <span class="sb-vak" id="sb-sel">—</span>
    <span class="sb-vak" id="sb-life"><span class="t en">Life force</span><span class="t nl">Levenskracht</span> <span class="sb-meter"><i id="sb-life-i" style="width:0%"></i></span> <b id="sb-life-v">—</b></span>
    <span class="sb-vak" id="sb-score">🏆 —</span>
    <span class="sb-vak" id="sb-tijd">—</span>
  </footer>
</div>
<ul id="eventlog"></ul>

<!-- Kits -->
<section class="kitv" data-kitv="eigenaar" style="left:12px;top:70px">
  <div class="kitv-kop"><span class="lampje"></span><b><span class="t en">Owner kit</span><span class="t nl">Eigenaarskit</span></b><button aria-label="close">✕</button></div>
  <div class="kitv-body" id="kit-eigenaar"></div>
</section>
<section class="kitv" data-kitv="gezondheid" style="left:356px;top:70px">
  <div class="kitv-kop"><span class="lampje"></span><b><span class="t en">Health kit</span><span class="t nl">Gezondheidskit</span></b><button aria-label="close">✕</button></div>
  <div class="kitv-body" id="kit-gezondheid"></div>
</section>
<section class="kitv" data-kitv="wetenschap" style="right:12px;top:70px">
  <div class="kitv-kop"><span class="lampje"></span><b><span class="t en">Science kit</span><span class="t nl">Wetenschapskit</span></b><button aria-label="close">✕</button></div>
  <div class="kitv-body" id="kit-wetenschap"></div>
</section>
<section class="kitv" data-kitv="opvoeden" style="right:356px;top:70px">
  <div class="kitv-kop"><span class="lampje"></span><b><span class="t en">Raising kit</span><span class="t nl">Opvoedkit</span></b><button aria-label="close">✕</button></div>
  <div class="kitv-body" id="kit-opvoeden"></div>
</section>

<script src="assets/botty-config.js"></script>
<script src="assets/botty-render.js"></script>
<script src="assets/botty-sprites.js"></script>
<script src="assets/botty-audio.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
  "use strict";
  // ── Basis ──────────────────────────────────────────────────────────────────
  var SVGNS = "http://www.w3.org/2000/svg";
  var supabase = window.supabase.createClient(BottyConfig.SUPABASE_URL, BottyConfig.SUPABASE_ANON);
  var TICK_URL = BottyConfig.SUPABASE_URL + "/functions/v1/hive-tick";
  function lang(){ return (window.SiteLang && SiteLang.get()) || "en"; }
  function T(en, nl){ return lang() === "nl" ? nl : en; }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]; }); }
  function klem01(x){ return x < 0 ? 0 : x > 1 ? 1 : x; }
  function kies(a){ return a[Math.floor(Math.random() * a.length)]; }
  function hashF(s){ var h = 2166136261; for (var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; }
  var opslag = { get: function(k, d){ try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
                 zet: function(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

  // ── De wereld (zelfde maten en vloeren als de Construct) ────────────────────
  var W_B = 1500, W_H = 844;
  var NIVEAUS = [{ vloer:405, xlo:70, xhi:1430 }, { vloer:662, xlo:110, xhi:1390 }];
  var TRAP_X = 565;
  var RUST = { x:1250, niv:1 };
  // Schaal per levensfase, gelijk aan de Construct (sprite-vak 200×250).
  var SCHAAL = { born:0.38, young:0.46, teen:0.50, adult:0.56, elder:0.58, sage:0.64 };
  function schaalVan(b){ return (SCHAAL[b.stage] || 0.54) * (b.grootte || 1); }
  function hoogteVan(b){ return 250 * schaalVan(b); }
  var PIX = { young:1, teen:1, adult:1, elder:1, sage:1 };
  var DRIFT = [["energie","⚡"],["data","💾"],["fit","🏃"],["geluk","😊"]];
  var DRIFT_NAAM = { en:{ energie:"energy", data:"data", fit:"fitness", geluk:"happiness" }, nl:{ energie:"energie", data:"data", fit:"fit", geluk:"geluk" } };
  var OBJ_NAAM = {
    en:{ laadkruk:"the charger", bord:"the blackboard", boekenkast:"the bookcase", lessenaar:"the desk", kastje:"the cabinet", kruk:"the stool", stolp:"the bell jar", bloempot:"the flowerpot", bal:"the globe", deur:"the open door" },
    nl:{ laadkruk:"de laadcomputer", bord:"het schoolbord", boekenkast:"de boekenkast", lessenaar:"de lessenaar", kastje:"het kastje", kruk:"de kruk", stolp:"de stolp", bloempot:"de bloempot", bal:"de wereldbol", deur:"de open deur" }
  };
  function objNaam(id){ return (OBJ_NAAM[lang()] || {})[id] || id; }
  var paletten = BottyRender.paletten, sprites = BottySprites.set;

          g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.025, t0 + 0.02); g.gain.linearRampToValueAtTime(0, t0 + 0.18);
          o.connect(g); g.connect(ctx.destination); o.start(t0); o.stop(t0 + 0.2);
        }
        vogel();
      }, 2500 + Math.random() * 6000);
    })();
  }
  function stopAmbient(){ if (audio.wind){ try { audio.wind.src.stop(); } catch (e) {} audio.wind = null; } clearTimeout(audio.timer); }
  var geluidKnop = document.getElementById("geluidknop");
  function zetGeluid(aan){
    audio.aan = aan; geluidKnop.querySelector(".ico").textContent = aan ? "🔊" : "🔇"; geluidKnop.setAttribute("aria-pressed", aan ? "true" : "false");
    if (window.BottyAudio){ if (BottyAudio.isGedempt() === aan) BottyAudio.setDemping(!aan); }
    if (aan) startAmbient(); else stopAmbient();
    opslag.zet("wereld-geluid", aan);
  }
  geluidKnop.addEventListener("click", function(){ zetGeluid(!audio.aan); });
  if (window.BottyAudio && !BottyAudio.isGedempt()) BottyAudio.setDemping(true);   // pas na een klik geluid

  // ── Live houden ─────────────────────────────────────────────────────────────
  laad();
  requestAnimationFrame(frame);
  supabase.channel("hive-live").on("broadcast", { event:"state" }, function(msg){ var p = msg.payload; if (p && p.bottys) toonState(p.bottys, p.eieren); }).subscribe();
  supabase.channel("hive-events").on("broadcast", { event:"actie" }, function(msg){ var p = msg.payload; if (p && p.tekst) voegEvent(stripTags(p.tekst)); }).subscribe();
  setInterval(function(){ if (!document.hidden && Date.now() - laatsteStaat > 9000) fetch(TICK_URL, { method:"POST" }).catch(function(){}); }, 10000);
  setInterval(function(){ if (!document.hidden && sel) laadDetail().then(noteerChem); }, 8000);
  setInterval(function(){ werkKitsBij(false); werkStatusBij(); }, 2000);
  window.addEventListener("resize", function(){ klemCam(doelCam); });
  if (window.SiteLang) SiteLang.onChange(function(){ vulPlekken(); werkKitsBij(true); werkStatusBij(); renderEventlog(); });
})();
